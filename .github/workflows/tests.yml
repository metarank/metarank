name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  METARANK_TRACKING: false

jobs:
  build:
    timeout-minutes: 20
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - jvm: 21
            platform: ubuntu-24.04
            architecture: x64
          - jvm: 25
            platform: ubuntu-24.04
            architecture: x64
          - jvm: 21
            platform: macos-15
            architecture: aarch64
          - jvm: 21
            platform: windows-2025
            architecture: x64

    steps:
    - name: install libomp
      run: brew install libomp && sudo mkdir -p /usr/local/lib/ && sudo ln -s /opt/homebrew/opt/libomp/lib/libomp.dylib /usr/local/lib/libomp.dylib
      if: runner.os == 'macOS'

    - uses: actions/checkout@v7
      with:
        lfs: 'true'

    - name: Start Redis on Linux
      run: sudo apt-get update && sudo apt-get install redis-server
      if: runner.os == 'Linux'

    - name: Start Redis on Mac
      run: brew install redis && brew services start redis
      if: runner.os == 'macOS'

    - name: Start Redis on Windows
      run: choco install memurai-developer
      if: runner.os == 'Windows'

    - uses: actions/cache@v6
      with:
        path: |
          ~/.sbt
          ~/.m2
          ~/.ivy2
          ~/.cache
        key: ${{ runner.os }}-build-${{ hashFiles('build.sbt', 'api/build.sbt', 'ingest/build.sbt', 'core/build.sbt', 'project/Deps.scala') }}

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.jvm }}
        architecture: ${{ matrix.architecture }}
        distribution: 'temurin'

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    - name: Check formatting
      run: sbt -mem 3000 "scalafmtCheckAll;It/scalafmtCheck"
      if: runner.os == 'Linux' && matrix.jvm == 21

    - name: Run tests
      run: sbt -mem 3000 test
